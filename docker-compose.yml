version: '3.8'

services:
  db-jarayid:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: jarayid_admin
      POSTGRES_PASSWORD: SecureAdminPass123!
      POSTGRES_DB: jarayid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jarayid-network

  redis-jarayid:
    image: redis:7
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --requirepass samjarayidredis
    networks:
      - jarayid-network

  app-jarayid-be:
    build: .
    restart: on-failure
    depends_on:
      - db-jarayid
      - redis-jarayid
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004

      # PostgreSQL
      DATABASE_URL: "postgresql://postgres:password@db-jarayid:5432/jarayid?connection_limit=10&pool_timeout=10"

      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      EXPIRES_IN: 7d

      # Bcrypt
      SALT: 10

      # Cloudinary
      CLOUD_NAME: driaxcout
      CLOUD_SECRET: RjBTgXN3d6u3qM4GQMEFD5FOiU8
      CLOUD_API_KEY: 789859598319819
      CLOUD_FOLDER: jarayid

      # SMTP
      SMTP_HOST: mail.esparkconsultants.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_SERVICE: mail
      SMTP_PASS: "I[2nz4L=}z8D"
      SMTP_FROM: shwcase@esparkconsultants.com

      # Password Reset
      PASSWORD_RESET_SECRET: your-super-secret-reset-key-change-this-in-production
      PASSWORD_RESET_EXPIRATION: 1h
      FRONTEND_URL: http://localhost:3000

      # Redis (using local redis container)
      REDIS_HOST: redis-jarayid
      REDIS_PORT: 6379
      REDIS_PASSWORD: samjarayidredis

      # RSS Processing
      RSS_CONCURRENCY: 3
      RSS_BATCH_SIZE: 5
      RSS_CRON_SCHEDULE: "*/15 * * * *"
      RSS_JOB_TIMEOUT: 300000
      RSS_RETRY_ATTEMPTS: 3
      RSS_RETRY_DELAY: 60000

      # OpenAI
      OPENAI_API_KEY: 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
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_MAX_TOKENS: 300
      OPENAI_TEMPERATURE: 0.3
      OPENAI_ENABLED: "false"
      OPENAI_TIMEOUT: 30000

      # Paddle Payment Gateway (add these to your .env file)
      PADDLE_API_KEY: ""
      PADDLE_WEBHOOK_SECRET: ""
      PADDLE_MONTHLY_PRICE_ID: ""
      PADDLE_YEARLY_PRICE_ID: ""
      PADDLE_SUCCESS_URL: "http://localhost:3000/payment/success"
      PADDLE_FAILURE_URL: "http://localhost:3000/payment/failure"
      PADDLE_CANCEL_URL: "http://localhost:3000/payment/cancel"

      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"

    networks:
      - jarayid-network
    volumes:
      - .:/app
      - /app/node_modules

networks:
  jarayid-network:
    driver: bridge

volumes:
  pgdata:
